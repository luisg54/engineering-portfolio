<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#111;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f5f5f7;--text2:#a1a1a6;--text3:#6e6e73;
  --accent:#2997ff;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Inter',BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.wrap{max-width:520px;text-align:center}
.code{font-size:12px;font-weight:500;color:var(--accent);background:rgba(41,151,255,0.1);padding:4px 12px;border-radius:980px;display:inline-block;margin-bottom:18px;letter-spacing:.04em}
h1{font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-0.03em;line-height:1.15;margin-bottom:14px}
p{font-size:15px;color:var(--text2);font-weight:300;margin-bottom:32px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;padding:12px 22px;border-radius:980px;text-decoration:none;transition:opacity .2s,background .2s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{opacity:.85}
.btn.secondary{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border2)}
.btn.secondary:hover{background:rgba(255,255,255,.12)}
.links{margin-top:36px;padding-top:24px;border-top:1px solid var(--border);display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.links a{font-size:13px;color:var(--text3);text-decoration:none;transition:color .2s}
.links a:hover{color:var(--text2)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
</style>
</head>
