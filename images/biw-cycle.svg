<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" width="100%">
<title>Weld redistribution across a three-robot spot-weld sequence</title>
<desc>Timeline comparison. Before: robot 1 is the bottleneck at 75 seconds while robots 2 and 3 finish at 58 and 52 seconds, leaving idle time. After: one weld and its approach and home points are reassigned from robot 1 to robot 2, balancing both at 65 seconds and reducing the station cycle by 10 seconds, a 13 percent improvement.</desc>
<defs>
  <marker id="moveArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9 Z" fill="#30d158"/>
  </marker>
</defs>

<rect width="900" height="400" fill="#0a0a0b"/>

<text x="20" y="30" font-family="monospace" font-size="12.5" font-weight="600" fill="#f5f5f7" letter-spacing="0.02em">STATION CYCLE &#8212; WELD REDISTRIBUTION</text>
<rect x="700" y="16" width="180" height="22" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.8"/>
<text x="790" y="31" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#30d158" letter-spacing="0.04em">&#8722;10 s  &#183;  13% FASTER</text>

<!-- ============ BEFORE ============ -->
<text x="20" y="62" font-family="monospace" font-size="10" fill="#ff453a" letter-spacing="0.09em">BEFORE  &#183;  75 s STATION CYCLE</text>

<text x="128" y="88" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 1</text>
<rect x="140" y="72" width="675" height="22" rx="3" fill="#2a0f0d" stroke="#ff453a" stroke-width="1" stroke-opacity="0.75"/>
<rect x="725" y="72" width="90" height="22" rx="3" fill="#1d1410" stroke="#ffb300" stroke-width="1" stroke-dasharray="3 2"/>
<text x="770" y="87" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#ffb300">WELD N</text>
<text x="716" y="87" text-anchor="end" font-family="monospace" font-size="9.5" fill="#ff453a">BOTTLENECK &#183; 75 s</text>

<text x="128" y="118" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 2</text>
<rect x="140" y="102" width="522" height="22" rx="3" fill="#122234" stroke="#2997ff" stroke-width="1" stroke-opacity="0.5"/>
<text x="652" y="117" text-anchor="end" font-family="monospace" font-size="9.5" fill="#2997ff" opacity="0.9">58 s</text>
<line x1="662" y1="113" x2="815" y2="113" stroke="#3d3d50" stroke-width="1" stroke-dasharray="3 4"/>
<text x="738" y="107" text-anchor="middle" font-family="monospace" font-size="8" fill="#3d3d50">IDLE 17 s</text>

<text x="128" y="148" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 3</text>
<rect x="140" y="132" width="468" height="22" rx="3" fill="#122234" stroke="#2997ff" stroke-width="1" stroke-opacity="0.5"/>
<text x="598" y="147" text-anchor="end" font-family="monospace" font-size="9.5" fill="#2997ff" opacity="0.9">52 s</text>
<line x1="608" y1="143" x2="815" y2="143" stroke="#3d3d50" stroke-width="1" stroke-dasharray="3 4"/>
<text x="711" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#3d3d50">IDLE 23 s</text>

<line x1="815" y1="66" x2="815" y2="162" stroke="#ff453a" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.85"/>

<!-- transfer arrow -->
<path d="M770 96 C 770 140, 700 150, 694 202" fill="none" stroke="#30d158" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#moveArrow)"/>
<text x="742" y="178" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#30d158" letter-spacing="0.03em">REASSIGNED IN TEACH MODE</text>

<!-- ============ AFTER ============ -->
<text x="20" y="192" font-family="monospace" font-size="10" fill="#30d158" letter-spacing="0.09em">AFTER  &#183;  65 s STATION CYCLE</text>

<text x="128" y="226" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 1</text>
<rect x="140" y="210" width="585" height="22" rx="3" fill="#0d1f12" stroke="#30d158" stroke-width="1" stroke-opacity="0.7"/>
<text x="715" y="225" text-anchor="end" font-family="monospace" font-size="9.5" fill="#30d158">65 s</text>

<text x="128" y="256" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 2</text>
<rect x="140" y="240" width="585" height="22" rx="3" fill="#122234" stroke="#2997ff" stroke-width="1" stroke-opacity="0.5"/>
<rect x="662" y="240" width="63" height="22" rx="3" fill="#0d1f12" stroke="#30d158" stroke-width="1"/>
<text x="693" y="255" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#30d158">+WELD N</text>
<text x="652" y="255" text-anchor="end" font-family="monospace" font-size="9.5" fill="#2997ff" opacity="0.9">65 s</text>

<text x="128" y="286" text-anchor="end" font-family="monospace" font-size="10" fill="#a1a1a6">ROBOT 3</text>
<rect x="140" y="270" width="468" height="22" rx="3" fill="#122234" stroke="#2997ff" stroke-width="1" stroke-opacity="0.5"/>
<text x="598" y="285" text-anchor="end" font-family="monospace" font-size="9.5" fill="#2997ff" opacity="0.9">52 s</text>

<line x1="725" y1="204" x2="725" y2="300" stroke="#30d158" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.85"/>

<!-- ============ TIME AXIS ============ -->
<line x1="140" y1="316" x2="860" y2="316" stroke="#2e3040" stroke-width="1"/>
<line x1="140" y1="316" x2="140" y2="322" stroke="#2e3040" stroke-width="1"/><text x="140" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">0</text>
<line x1="230" y1="316" x2="230" y2="322" stroke="#2e3040" stroke-width="1"/><text x="230" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">10</text>
<line x1="320" y1="316" x2="320" y2="322" stroke="#2e3040" stroke-width="1"/><text x="320" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">20</text>
<line x1="410" y1="316" x2="410" y2="322" stroke="#2e3040" stroke-width="1"/><text x="410" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">30</text>
<line x1="500" y1="316" x2="500" y2="322" stroke="#2e3040" stroke-width="1"/><text x="500" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">40</text>
<line x1="590" y1="316" x2="590" y2="322" stroke="#2e3040" stroke-width="1"/><text x="590" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">50</text>
<line x1="680" y1="316" x2="680" y2="322" stroke="#2e3040" stroke-width="1"/><text x="680" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">60</text>
<line x1="770" y1="316" x2="770" y2="322" stroke="#2e3040" stroke-width="1"/><text x="770" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">70</text>
<line x1="860" y1="316" x2="860" y2="322" stroke="#2e3040" stroke-width="1"/><text x="860" y="336" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50">80</text>
<text x="500" y="352" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3d3d50" letter-spacing="0.06em">SECONDS</text>

<!-- ============ FOOTER BAND ============ -->
<line x1="0" y1="366" x2="900" y2="366" stroke="#1a1c22" stroke-width="1"/>
<rect x="0" y="367" width="900" height="33" fill="#060608"/>
<text x="20" y="388" font-family="monospace" font-size="9.5" fill="#6e6e73" letter-spacing="0.06em">BOTTLENECK ANALYSIS &#183; REPRESENTATIVE TIMINGS &#8212; NOT ACTUAL STATION PROGRAM DATA</text>
<rect x="756" y="374" width="124" height="19" rx="4" fill="#0d1f12" stroke="#30d158" stroke-width="0.6"/>
<text x="818" y="387" text-anchor="middle" font-family="monospace" font-size="9" fill="#30d158">LOCKED IN PRODUCTION</text>
</svg>
