<rect x="340" y="262" width="30" height="24" rx="5" fill="#2a0f0d" stroke="#ff453a" stroke-width="0.9"/><text x="355" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#ff453a">Tx</text>
<rect x="378" y="262" width="30" height="24" rx="5" fill="#2a0f0d" stroke="#ff453a" stroke-width="0.9"/><text x="393" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#ff453a">Ty</text>
<rect x="416" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="431" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Tz</text>
<rect x="454" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="469" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Rx</text>
<rect x="492" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="507" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Ry</text>
<rect x="530" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="545" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Rz</text>
<line x1="340" y1="304" x2="560" y2="304" stroke="#1f1f22" stroke-width="1"/>
<text x="340" y="326" font-family="monospace" font-size="9" fill="#6e6e73">Track envelope occupies the</text>
