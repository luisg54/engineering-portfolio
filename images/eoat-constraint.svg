<text x="44" y="326" font-family="monospace" font-size="9" fill="#6e6e73">Paired locators fix translation</text>
<text x="44" y="342" font-family="monospace" font-size="9" fill="#6e6e73">and rotation before the part</text>
<text x="44" y="358" font-family="monospace" font-size="9" fill="#6e6e73">is placed downstream.</text>

