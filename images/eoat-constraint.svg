<circle cx="208" cy="145" r="3.5" fill="#2997ff"/>
<text x="208" y="211" text-anchor="middle" font-family="monospace" font-size="8" fill="#2997ff" opacity="0.85">LOC 2</text>
<rect x="70" y="226" width="168" height="20" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.8"/>
<text x="154" y="240" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158" letter-spacing="0.05em">6 / 6 CONSTRAINED</text>
<rect x="44" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="59" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Tx</text>
<rect x="82" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="97" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Ty</text>
