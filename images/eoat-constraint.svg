<rect x="158" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="173" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Rx</text>
<rect x="196" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="211" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Ry</text>
<rect x="234" y="262" width="30" height="24" rx="5" fill="#0d1f12" stroke="#30d158" stroke-width="0.9"/><text x="249" y="278" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#30d158">Rz</text>
