<svg viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" role="img" width="100%">
<title>6-DOF constraint analysis &#8212; as designed, feeder conflict, and redesign</title>
<desc>Three-panel schematic. Panel one: two locating features constrain all six degrees of freedom of the part. Panel two: the bowl feeder track envelope occupies the second locator position, forcing its removal and leaving X and Y translation uncontrolled. Panel three: a relocated locating feature clears the track envelope and restores full six-degree-of-freedom constraint.</desc>
<defs>
  <pattern id="trkRed" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#ff453a" stroke-width="1.3" opacity="0.45"/>
  </pattern>
  <pattern id="trkGrey" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#6e6e73" stroke-width="1.3" opacity="0.4"/>
  </pattern>
  <marker id="freeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9 Z" fill="#ff453a"/>
  </marker>
</defs>

<rect width="900" height="440" fill="#0a0a0b"/>

