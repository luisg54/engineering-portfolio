<text x="154" y="92" text-anchor="middle" font-family="monospace" font-size="8" fill="#2e3040" letter-spacing="0.05em">PART &#8212; PLAN VIEW</text>
<rect x="52" y="100" width="204" height="90" rx="4" fill="#16181e" stroke="#2e3040" stroke-width="1"/>
<line x1="52" y1="130" x2="256" y2="130" stroke="#1e2028" stroke-width="0.6"/>
<line x1="52" y1="160" x2="256" y2="160" stroke="#1e2028" stroke-width="0.6"/>
<circle cx="100" cy="145" r="11" fill="#0d1525" stroke="#2997ff" stroke-width="1.6"/>
<circle cx="100" cy="145" r="3.5" fill="#2997ff"/>
<text x="100" y="211" text-anchor="middle" font-family="monospace" font-size="8" fill="#2997ff" opacity="0.85">LOC 1</text>
